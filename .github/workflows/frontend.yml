name: Frontend Tests

on:
  push:
    branches: [main]
  pull_request:  
    branches: [main]
  workflow_call:  

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 18 avec cache npm
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Installez les dépendances
        run: |
          cd frontend
          npm ci

      - name: Lancez les tests
        run: |
          cd frontend
          npm test -- --run

      - name: Vérifiez le build
        run: |
          cd frontend
          npm run build
